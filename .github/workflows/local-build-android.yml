name: local-build-android

# Krita for Android (APK / AAB) built with the scripts in build-tools/local-build.
#
# The pipeline runs steps 1-6 of build-android.sh (check -> SDK/NDK -> sources ->
# deps -> compile -> package) inside the checked-out tree: the checkout itself is
# reused as the Krita source, so the APK is built from the exact commit of the run.
#
# Cost: the official way to build Krita for Android needs Linux plus a lot of
# disk (SDK/NDK, KDE prebuilt dependencies, the build tree). A hosted runner is
# tight even after freeing space, so prefer a larger or self-hosted runner
# (input "runner") for real builds. Caches cover the SDK/NDK and the
# Python/dependency downloads.
#
# Trigger: manual only - Actions -> "local-build-android" -> Run workflow.
# Nothing runs on push / pull_request; uncomment the block below if you ever
# want a tag push to start it automatically.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (a larger or self-hosted Linux runner is recommended)'
        required: false
        default: ubuntu-24.04
      abi:
        description: 'Target ABI'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
        default: arm64-v8a
      package:
        description: 'Gradle package type'
        type: choice
        options:
          - debug
          - release
          - nightly
        default: debug
      aab:
        description: 'Also build an Android App Bundle (AAB)'
        type: boolean
        default: false
      jobs:
        description: 'Parallel compile jobs (empty = number of cores)'
        required: false
        default: ''
  # push:
  #   tags:
  #     - 'android-build-*'

permissions:
  contents: read

concurrency:
  group: local-build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Krita APK
    # Pinned to 24.04 on purpose: it is the image the build is validated on and
    # avoids surprises from brand-new "ubuntu-latest" releases. Override via the
    # "runner" input when you need something else.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 480
    # Job-level env wins over whatever the runner image ships (it preinstalls an
    # Android SDK/NDK and exports ANDROID_HOME / ANDROID_SDK_ROOT /
    # ANDROID_NDK_ROOT). All build state lives in a sibling of the checkout
    # (<parent>/krita-ci, i.e. OUTSIDE the workspace). The prepare step
    # canonicalises these into $GITHUB_ENV; the values here only seed it.
    env:
      # Belt and braces: ANDROID_ROOT plus the scripts' own override
      # (KRITA_ANDROID_ROOT), so nothing inherited can point us elsewhere.
      # ANDROID_NDK / ANDROID_NDK_HOME are overridden as well: the runner image
      # exports them pointing at its own NDK, which the free-disk step deletes.
      CI_HOME: ${{ github.workspace }}/../krita-ci
      ANDROID_ROOT: ${{ github.workspace }}/../krita-ci/android
      KRITA_ANDROID_ROOT: ${{ github.workspace }}/../krita-ci/android
      ANDROID_NDK_ROOT: ${{ github.workspace }}/../krita-ci/android/sdk/ndk/27.3.13750724
      ANDROID_NDK: ${{ github.workspace }}/../krita-ci/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_HOME: ${{ github.workspace }}/../krita-ci/android/sdk/ndk/27.3.13750724
      WORKDIR: ${{ github.workspace }}/../krita-ci/work
      # Gradle's home (dependency cache + init script with mirrors) also lives
      # outside the checkout, next to the other CI state.
      GRADLE_USER_HOME: ${{ github.workspace }}/../krita-ci/work/gradle-home
      KRITA_COPY_TO_DESKTOP: '0'
      KRITA_MIN_FREE_GB: '15'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/az /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install host packages
        run: |
          sudo apt-get update
          # gettext + libxml2: KF5I18n's pofiles target runs the msgfmt shipped in
          # _install/bin, which is a host binary and needs libxml2.so.2; without it
          # the build dies with "error while loading shared libraries".
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config unzip ccache gettext libxml2 libglib2.0-0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Layout expected by the scripts:
      #   $SRCDIR       = parent of the checkout (canonical, no "..")
      #   $SRCDIR/krita = the checkout itself -> no clone, no symlink
      #   $WORKDIR      = venv / dependency cache / CI work dir (outside repo)
      #   $ANDROID_ROOT = SDK / NDK / downloads (outside repo)
      # Everything is written to $GITHUB_ENV in canonical form so later steps
      # never see a path with ".." or a symlink back into the workspace (that
      # made CMake's KDE install-dir logic recurse).
      - name: Prepare workspace layout
        run: |
          base="$(cd "$GITHUB_WORKSPACE/.." && pwd -P)"
          CI_HOME="$base/krita-ci"
          ANDROID_ROOT="$CI_HOME/android"
          WORKDIR="$CI_HOME/work"
          NDK="$ANDROID_ROOT/sdk/ndk/27.3.13750724"
          # The scripts expect the source tree at $SRCDIR/krita, and that path must
          # be a REAL directory (not a symlink): CMake stores the path it is given
          # as CMAKE_SOURCE_DIR and, when that differs from its realpath, ECM/KDE
          # install-dir logic re-joins the difference over and over
          # (.../.ci/src/krita/.ci/src/krita/...) until CMAKE_INSTALL_PREFIX points
          # at a directory that does not exist.
          #
          # Normally the checkout IS ".../<repo>/<repo>", so "$base/krita" is
          # already the checkout and nothing happens here. A renamed fork would put
          # it elsewhere, so relocate the checkout once (the old workspace path is
          # left behind as a symlink so relative paths in later steps still work).
          if [[ "$base/krita" != "$GITHUB_WORKSPACE" ]]; then
            echo "::warning::checkout is not named 'krita'; relocating it to $base/krita so the source tree is a real directory, not a symlink"
            mv "$GITHUB_WORKSPACE" "$base/krita"
            ln -sfn "$base/krita" "$GITHUB_WORKSPACE"
          fi
          {
            echo "CI_HOME=$CI_HOME"
            echo "ANDROID_ROOT=$ANDROID_ROOT"
            echo "KRITA_ANDROID_ROOT=$ANDROID_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "ANDROID_NDK=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "WORKDIR=$WORKDIR"
            echo "SRCDIR=$base"
          } >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_ROOT" "$WORKDIR"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "SRCDIR=$base"
          echo "SRCDIR/krita=$base/krita"
          echo "ANDROID_ROOT=$ANDROID_ROOT"
          echo "WORKDIR=$WORKDIR"
          echo "ANDROID_NDK_ROOT=$NDK"
          test -e "$base/krita/.git"
          java -version
          cmake --version | head -n 1
          ninja --version
          python --version

      - name: Restore Android SDK / NDK cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../krita-ci/android
          key: local-build-android-sdk-v3-${{ runner.os }}-${{ inputs.abi || 'arm64-v8a' }}-${{ hashFiles('build-tools/local-build/scripts/10-setup-sdk.sh') }}
          restore-keys: |
            local-build-android-sdk-v3-${{ runner.os }}-${{ inputs.abi || 'arm64-v8a' }}-

      - name: Restore Python / dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../krita-ci/work/PythonEnv
            ${{ github.workspace }}/../krita-ci/work/envdir
            ${{ github.workspace }}/../krita-ci/work/cache
          key: local-build-android-deps-v3-${{ runner.os }}-${{ inputs.abi || 'arm64-v8a' }}-${{ hashFiles('build-tools/local-build/scripts/30-fetch-deps.sh') }}
          restore-keys: |
            local-build-android-deps-v3-${{ runner.os }}-${{ inputs.abi || 'arm64-v8a' }}-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../krita-ci/work/gradle-home
          key: local-build-android-gradle-v1-${{ runner.os }}-${{ hashFiles('build-tools/local-build/scripts/50-build-package.sh') }}
          restore-keys: |
            local-build-android-gradle-v1-${{ runner.os }}-

      # Maven Central rate-limits the shared IPs of GitHub-hosted runners and
      # answers "429 Too Many Requests", which aborts androiddeployqt's Gradle
      # configure phase ("Could not resolve all artifacts for configuration
      # 'classpath'"). An init script makes Gradle try mirrors of Central first
      # and keeps google() for the Android Gradle Plugin artifacts; the build
      # step additionally retries when the log shows a 429.
      - name: Configure Gradle mirrors
        run: |
          mkdir -p "$GRADLE_USER_HOME"
          cat > "$GRADLE_USER_HOME/init.gradle" <<'EOF'
          // repo.maven.apache.org returns 429 for shared CI IPs; try mirrors first.
          def centralMirrors = [
              'https://maven-central.storage-download.googleapis.com/maven2',
              'https://repo1.maven.org/maven2',
          ]

          def addMirrors = { RepositoryHandler repos ->
              centralMirrors.each { mirrorUrl ->
                  repos.maven { it.url = mirrorUrl }
              }
              repos.google()
              repos.mavenCentral()
          }

          allprojects { project ->
              project.buildscript.repositories { addMirrors(delegate) }
              project.repositories { addMirrors(delegate) }
          }

          settingsEvaluated { settings ->
              settings.pluginManagement.repositories { addMirrors(delegate) }
          }
          EOF
          cat "$GRADLE_USER_HOME/init.gradle"

      - name: Build APK
        working-directory: build-tools/local-build
        env:
          ANDROID_ABI: ${{ inputs.abi || 'arm64-v8a' }}
          PACKAGE_KIND: ${{ inputs.package || 'debug' }}
          WITH_AAB: ${{ inputs.aab || false }}
          JOB_COUNT: ${{ inputs.jobs }}
        run: |
          args=(all)
          case "$PACKAGE_KIND" in
            release) args+=(--release) ;;
            nightly) args+=(--nightly) ;;
          esac
          if [[ "$WITH_AAB" == "true" ]]; then
            args+=(--aab)
          fi
          if [[ -n "$JOB_COUNT" ]]; then
            args+=(--jobs "$JOB_COUNT")
          else
            args+=(--jobs "$(nproc)")
          fi
          # run.sh tees the complete output to logs/<timestamp>-all.log while still
          # streaming it to the job console, and exposes the real exit code.
          #
          # The package step finishes with androiddeployqt + Gradle, which downloads
          # the Android Gradle Plugin from Maven Central. Shared runner IPs get
          # rate limited (HTTP 429) there, so retry the whole run - it is
          # incremental, so a retry only redoes the packaging - but only when the
          # log actually mentions 429 (a real compile error must fail fast).
          attempt=1
          max_attempts=3
          echo "== scripts/run.sh ${args[*]}"
          while true; do
            if bash scripts/run.sh "${args[@]}"; then
              break
            fi
            if (( attempt >= max_attempts )); then
              echo "::error::build failed ${attempt} times (see the log artifacts)"
              exit 1
            fi
            if [[ -f logs/latest.log ]] && grep -q 'status code 429' logs/latest.log; then
              wait_seconds=$(( attempt * 60 ))
              echo "::warning::Maven Central rate limited the download (HTTP 429); retrying in ${wait_seconds}s (attempt $(( attempt + 1 ))/${max_attempts})"
              sleep "$wait_seconds"
              attempt=$(( attempt + 1 ))
              continue
            fi
            exit 1
          done

      # Snapshot everything that helps reading a failure: versions, env, git state,
      # CMake logs. Never fails the job; the files are uploaded with the log artifact.
      - name: Collect build diagnostics
        if: always()
        working-directory: build-tools/local-build
        run: |
          set +e
          mkdir -p logs/diagnostics
          src="$SRCDIR/krita"
          {
            echo "===== date ====="; date -u
            echo "===== uname ====="; uname -a
            echo "===== nproc ====="; nproc
            echo "===== disk ====="; df -h
            echo "===== memory ====="; free -h
            echo "===== toolchain ====="
            java -version 2>&1
            cmake --version 2>&1 | head -n 2
            ninja --version 2>&1
            python --version 2>&1
            echo "===== config (KRITA_/ANDROID_/KDECI_) ====="
            env | grep -E '^(KRITA_|ANDROID_|KDECI_|WORKDIR|SRCDIR|ENVDIR|VENVDIR|JAVA_HOME)' | sort
            echo "===== source head ====="
            git -C "$src" rev-parse HEAD 2>&1
            git -C "$src" status --porcelain 2>&1 | head -n 50
            echo "===== dist ====="; ls -lh dist 2>&1
            echo "===== logs ====="; ls -lh logs 2>&1
          } > logs/diagnostics/summary.txt 2>&1

          for f in \
            "$WORKDIR/base-env" \
            "$src/env" \
            "$src/_build/CMakeCache.txt" \
            "$src/_build/CMakeFiles/CMakeOutput.log" \
            "$src/_build/CMakeFiles/CMakeError.log"; do
            if [[ -f "$f" ]]; then
              cp "$f" "logs/diagnostics/$(basename "$f")"
            fi
          done
          ls -lh logs logs/diagnostics 2>&1
          exit 0

      - name: Collect artifacts
        run: |
          ls -lh build-tools/local-build/dist
          shopt -s nullglob
          files=(build-tools/local-build/dist/*.apk build-tools/local-build/dist/*.aab)
          if (( ${#files[@]} == 0 )); then
            echo "::error::no APK/AAB in build-tools/local-build/dist"
            exit 1
          fi
          printf '%s\n' "${files[@]}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: krita-android-${{ inputs.abi || 'arm64-v8a' }}-${{ inputs.package || 'debug' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build-tools/local-build/dist/*.apk
            build-tools/local-build/dist/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build-tools/local-build/logs/**
          if-no-files-found: warn
          retention-days: 7

      # Put the first [err] line and the tail of the full log into the run summary,
      # so a failure is readable without downloading the artifact.
      - name: Failure log summary
        if: failure()
        working-directory: build-tools/local-build
        run: |
          set +e
          log=logs/latest.log
          if [[ ! -f "$log" ]]; then
            echo "::error::no logs/latest.log was produced"
            exit 0
          fi
          first="$(grep -m1 '\[err\]' "$log")"
          if [[ -n "$first" ]]; then
            echo "::error::$first"
          fi
          {
            echo ""
            echo "### Build failed"
            echo ""
            echo "First error: \`${first:-unknown}\`"
            echo ""
            echo '```'
            tail -n 200 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          set +e
          {
            echo "### Krita for Android"
            echo ""
            echo "- ABI: \`${{ inputs.abi || 'arm64-v8a' }}\`"
            echo "- Package: \`${{ inputs.package || 'debug' }}\`"
            echo ""
            echo "#### Artifacts"
            echo '```'
            ls -lh build-tools/local-build/dist 2>/dev/null || echo 'dist/ missing'
            echo '```'
            echo "#### Logs (full log also uploaded as the \`android-build-logs-*\` artifact)"
            echo '```'
            ls -lh build-tools/local-build/logs 2>/dev/null
            ls -lh build-tools/local-build/logs/diagnostics 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
